name: home-proxy

services:

  main-service:
    image: nginx@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
    container_name: homelab
    ports:
      - "${PORT}:${PORT}"
    environment:
      - PORT=${PORT}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-available:/etc/nginx/sites-available:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx:rw
      - /etc/localtime:/etc/localtime:ro
    restart: always
    networks:
      homelab-public:
      homelab-internal:
        aliases:
          - auth.homelab.cz
      homelab-monitoring:
        aliases:
          - auth.homelab.cz
    depends_on:
      - authelia

  authelia:
    container_name: authelia
    image: authelia/authelia:latest
    user: "${PUID}:${PGID}"
    command:
      - authelia
      - --config=/config/configuration.yml
      - --config=/config/authentication.yml
      - --config=/config/access-control.yml
      - --config=/config/two_factor.yml
      - --config=/config/oidc-clients.yml
    environment:
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE=/secrets/JWT_SECRET
      - AUTHELIA_SESSION_SECRET_FILE=/secrets/SESSION_SECRET
      - AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE=/secrets/STORAGE_PASSWORD
      - AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE=/secrets/STORAGE_ENCRYPTION_KEY
      - X_AUTHELIA_CONFIG_FILTERS=template
    volumes:
      - ./authelia/config:/config
      - ./authelia/secrets:/secrets
      - /etc/localtime:/etc/localtime:ro
    restart: always
    networks:
      - homelab-internal
      - homelab-private

volumes:
  nginx_cache:

networks:
  homelab-public:
    name: homelab-public
    driver: bridge
  homelab-internal:
    external: true
    name: homelab-internal
  homelab-monitoring:
    external: true
    name: homelab-monitoring
  homelab-private:
    external: true
    name: homelab-private

