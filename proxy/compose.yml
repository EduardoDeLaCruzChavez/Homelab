name: home-proxy

services:

  homelab:
    image: nginx@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
    container_name: homelab
    ports:
      - "${PORT}:${PORT}"
    environment:
      - PORT=${PORT}
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./nginx/sites-available:/etc/nginx/sites-available:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx:rw
      - /etc/localtime:/etc/localtime:ro
    restart: always
    networks:
      homelab-public:
      homelab-internal:
        aliases:
          - auth.homelab.cz
      homelab-monitoring:
        aliases:
          - auth.homelab.cz
    depends_on:
      - authelia

  authelia:
    image: authelia/authelia@sha256:a039d87fb842f0af4f83c03434f5fb6ec45d4b46e86b8b3ac571cc104bbe6e6d
    container_name: authelia
    user: "${PUID}:${PGID}"
    command:
      - authelia
      - --config=/config/configuration.yml
      - --config=/config/authentication.yml
      - --config=/config/access-control.yml
      - --config=/config/two_factor.yml
      - --config=/config/oidc-clients.yml
    environment:
      - X_AUTHELIA_CONFIG_FILTERS=template
      - AUTHELIA_SESSION_SECRET_FILE=/secrets/SESSION_SECRET
      - AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE=/secrets/STORAGE_PASSWORD
      - AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE=/secrets/STORAGE_ENCRYPTION_KEY
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE=/secrets/JWT_SECRET
    volumes:
      - ./authelia/config:/config
      - ./authelia/secrets:/secrets
      - /etc/localtime:/etc/localtime:ro
    restart: always
    networks:
      - homelab-internal
      - homelab-private

volumes:
  nginx_cache:

networks:
  homelab-public:
    name: homelab-public
    driver: bridge
  homelab-internal:
    external: true
    name: homelab-internal
  homelab-monitoring:
    external: true
    name: homelab-monitoring
  homelab-private:
    external: true
    name: homelab-private

