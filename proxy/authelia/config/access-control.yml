
access_control:
  default_policy: deny
  networks:
    - name: docker_network
      networks:
        - 172.16.0.0/12
    - name: local_network
      networks:
        - 192.168.8.0/24
    - name: private_network
      networks:
        - 192.168.8.134/32

  rules:
    - domain: 'homelab.cz'
      policy: bypass

    - domain:
      - 'wakapi.homelab.cz'
      - 'vikunja.homelab.cz'
      - 'vaultwarden.homelab.cz'
      - 'actualbudget.homelab.cz'
      networks:
        - local_network
        - docker_network
      policy: bypass

    - domain:
      - 'beszel.homelab.cz'
      - 'myadmin.homelab.cz'
      - 'drydock.homelab.cz'
      subject: "group:admin"
      networks:
        - private_network
        - docker_network
      policy: one_factor

