server {
  server_name drydock.homelab.cz;

  include /etc/nginx/conf.d/global.conf;


  set $upstream_drydock http://drydock:3000;

  location ^~ /assets/ {
    include snippets/authelia-protect.conf;
    proxy_pass $upstream_drydock;
    include snippets/proxyHeader.conf;
    access_log off;
    log_not_found on;
  }

  location / {
    include snippets/authelia-protect.conf;
    proxy_pass $upstream_drydock;
    include snippets/proxyHeader.conf;
  }
}

