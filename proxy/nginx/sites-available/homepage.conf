server {
  server_name homelab.cz;

  include /etc/nginx/conf.d/global.conf;

  set $upstream_homepage http://homepage:3000;

  location ^~ /_next/static/ {
    proxy_pass $upstream_homepage;
    include snippets/spa-cache.conf;
    access_log off;
    log_not_found on;
  }


  location / {
    proxy_pass $upstream_homepage;
    include snippets/proxyHeader.conf;
  }
}


