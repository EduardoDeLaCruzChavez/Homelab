name: monitoring

services:

  beszel:
    image: henrygd/beszel@sha256:897e807a065adf8e89e30ae0cd79d1f5e38fe84ccaffbc418bde9d3cdca4eacc
    container_name: monitoring
    user: "${PUID}:${PGID}"
    environment:
      - DISABLE_PASSWORD_AUTH=true # <DISABLE_FIRST_SETUP>
      - USER_CREATION=true
      - APP_URL=https://beszel.${DOMAIN_PORT}/
    volumes:
      - ./beszel_data:/beszel_data
      - ${CERT_CRT}:/etc/ssl/certs/custom-ca.crt:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    networks:
      - homelab-monitoring
    healthcheck:
      test: ['CMD', '/beszel', 'health', '--url', 'http://localhost:8090']
      start_period: 5s
      interval: 120s

  beszel-agent:
    image: henrygd/beszel-agent@sha256:765e3d4a087c4bcbf6b78ed0f1dfdcd669c4bf6ad5789a832d2944603ae7fd08
    container_name: beszel-agent
    environment:
      - LISTEN=45876
      - HUB_URL=http://beszel:8090
      - TOKEN_FILE=/run/secrets/beszel_token
      - KEY_FILE=/run/secrets/beszel_key
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    secrets:
      - beszel_key
      - beszel_token
    restart: unless-stopped
    networks:
      - homelab-monitoring
    healthcheck:
      test: ['CMD', '/agent', 'health']

  socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: socket-proxy
    read_only: true
    tmpfs:
      - /run
      - /tmp
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - POST=0
      - DELETE=0
      - PUT=0
      - EXEC=0
      - VOLUMES=0
      - NETWORKS=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - homelab-socket

  trivy:
    image: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    container_name: trivy
    entrypoint: ["trivy", "server", "--listen", "0.0.0.0:4954"]
    user: "${PUID}:${PGID}"
    tmpfs:
      - /tmp
    environment:
      - TRIVY_CACHE_DIR=/tmp/cache
    volumes:
      - ./trivy-cache:/tmp/cache
    restart: unless-stopped
    networks:
      - homelab-monitoring
      - homelab-public

  drydock:
    image: codeswhat/drydock@sha256:8ad0c550a919f6e2c2c058dfc170ae0ffcb671fb9521b8f9a4fcf1bdf1a9047b
    container_name: drydock
    user: "${PUID}:${PGID}"
    environment:
      - DD_WATCHER_LOCAL_HOST=socket-proxy
      - DD_WATCHER_LOCAL_PORT=2375
      - DD_PUBLIC_URL=https://drydock.${DOMAIN_PORT}
      - DD_COOKIE_SECURE=false
      - DD_DISABLE_BOOT_CHECK=true
      - DD_SECURITY_SKIP_BOOT_SCAN=true
      - DD_WATCHER_LOCAL_CRON=0 0 * * *
      - DD_SECURITY_SCAN_CRON=0 3 * * *
      - DD_SECURITY_SCANNER=trivy
      - DD_SECURITY_TRIVY_SERVER=http://trivy:4954
      - DD_SECURITY_BLOCK_SEVERITY=CRITICAL,HIGH
      - DD_SERVER_TRUSTPROXY=1
      - PORT=3000
      - DD_AUTH_BASIC_ADMIN_USER=admin
      - DD_AUTH_BASIC_ADMIN_HASH__FILE=/run/secrets/admin_hash
    volumes:
      - ./drydock-data:/store
      - /etc/localtime:/etc/localtime:ro
    secrets:
      - admin_hash
    depends_on:
      - socket-proxy
    restart: unless-stopped
    networks:
      - homelab-socket
      - homelab-monitoring
      - homelab-public

volumes:
  beszel_agent_data:

secrets:
  beszel_key:
    file: .pswd/beszel_key
  beszel_token:
    file: .pswd/beszel_token
  admin_hash:
    file: .pswd/drydock_pswd

networks:
  homelab-monitoring:
    name: homelab-monitoring
    driver: bridge
    internal: true
  homelab-socket:
    name: homelab-socket
    driver: bridge
    internal: true
  homelab-public:
    name: homelab-public
    external: true

