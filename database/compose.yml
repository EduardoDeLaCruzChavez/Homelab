name: database

services:

  postgres:
    image: postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    container_name: postgres
    environment:
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - glob-database:/var/lib/postgresql
    secrets:
      - postgres_user
      - postgres_password
    restart: always
    networks:
      - homelab-private
    healthcheck:
     test: ["CMD-SHELL", "pg_isready -q"]
     interval: 30s
     timeout: 5s
     retries: 3
     start_period: 15s

  myadmin:
    image: dpage/pgadmin4@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    container_name: myadmin
    environment:
      - REQUESTS_CA_BUNDLE=/certs/proxy-ca.crt
      - PGADMIN_DEFAULT_EMAIL=admin@valorant.com
      - PGADMIN_DEFAULT_PASSWORD_FILE=/run/secrets/email_password
      - PGADMIN_LISTEN_PORT=8080
      - PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED=False
      - PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION=False
      - PGADMIN_CONFIG_PROXY_X_FOR_COUNT=1
      - PGADMIN_CONFIG_PROXY_X_HOST_COUNT=1
      - PGADMIN_CONFIG_PROXY_X_PROTO_COUNT=1
      - PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT=1
    volumes:
      - pdadmin-data:/var/lib/pgadmin
      - ${CERT_CRT}:/certs/proxy-ca.crt:ro
      - ./config/config_local.py:/pgadmin4/config_local.py:ro
      - /etc/localtime:/etc/localtime:ro
    secrets:
      - email_password
      - pgadmin_secret
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - homelab-internal
      - homelab-private
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/misc/ping"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pdadmin-data:
  glob-database:

secrets:
  postgres_user:
    file: .pswd/user
  postgres_password:
    file: .pswd/db_pswd
  email_password:
    file: .pswd/pgadmin_email_pswd
  pgadmin_secret:
    file: .pswd/pgadmin_secret

networks:
  homelab-internal:
    name: homelab-internal
    driver: bridge
    internal: true
  homelab-private:
    name: homelab-private
    driver: bridge
    internal: true
