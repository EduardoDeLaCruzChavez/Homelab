name: home-service

services:

  homepage:
    image: ghcr.io/gethomepage/homepage@sha256:da9dca9ec258c628146bed1445da0853f2b88f0b10bafd97c091de807c363d60
    container_name: homepage
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${ALLOWED_HOST}
      - PUID=${PUID}
      - PGID=${PGID}
    restart: unless-stopped
    volumes:
      - ./homepage/config:/app/config
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - wakapi
    networks:
      - homelab-internal

  wakapi:
    image: ghcr.io/muety/wakapi@sha256:00662767731a6797d4be02cbc6c3f32b7ff8d0c683ee10ec5612856d4efbb3bf
    container_name: wakapi
    environment:
      - /etc/localtime:/etc/localtime:ro
      - WAKAPI_BASE_PATH=/
      - WAKAPI_DB_TYPE=postgres
      - WAKAPI_DB_HOST=postgres
      - WAKAPI_DB_PORT=5432
      - WAKAPI_DB_NAME=wakapi
      - WAKAPI_DB_USER=wakapi
      - WAKAPI_DB_PASSWORD_FILE=/run/secrets/wakapi_password
      #wakapi config
      - WAKAPI_LEADERBOARD_ENABLED=false
      - WAKAPI_PUBLIC_STATS=false
    volumes:
      - /etc/localtime:/etc/localtime:ro
    secrets:
      - wakapi_password
    restart: unless-stopped
    networks:
      - homelab-internal
      - homelab-private

  vikunja:
    image: vikunja/vikunja@sha256:22df4c1bc8843c28d383bc5f52b59e7b601bf5f6560b36b29c0a500833c77fa3
    container_name: vikunja
    environment:
      - VIKUNJA_SERVICE_PUBLICURL=https://vikunja.${DOMAIN_PORT}/
      - VIKUNJA_CORS_ENABLE=true
      - VIKUNJA_CORS_ORIGINS=https://vikunja.${DOMAIN_PORT}
      - VIKUNJA_DATABASE_HOST=postgres
      - VIKUNJA_DATABASE_TYPE=postgres
      - VIKUNJA_DATABASE_DATABASE=vikunja
      - VIKUNJA_DATABASE_USER=vikunja
      - VIKUNJA_DATABASE_PASSWORD_FILE=/run/secrets/vikunja_password
      - VIKUNJA_SERVICE_SECRET_FILE=/run/secrets/vikunja_secret
    volumes:
      - ./vikunja:/app/vikunja/files
      - /etc/localtime:/etc/localtime:ro
    secrets:
      - vikunja_password
      - vikunja_secret
    restart: unless-stopped
    networks:
      - homelab-internal
      - homelab-private
    healthcheck:
      test: ["CMD", "/app/vikunja/vikunja", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  vaultwarden:
    build: ./vaultwarden
    container_name: vaultwarden
    environment:
      - DOMAIN=https://vaultwarden.${DOMAIN_PORT}/
      - SIGNUPS_ALLOWED=true
    volumes:
      - ./vault_data:/data
      - /etc/localtime:/etc/localtime:ro
    secrets:
      - vaultwarden_db_password
    restart: unless-stopped
    networks:
      - homelab-internal
      - homelab-private

  actual-budget:
    image: actualbudget/actual-server@sha256:055bd958cdf3224aa0816dedb9ded75704dfa1f26f9ce663d95b0fc8d249931f
    container_name: actual-budget
    environment:
      - NODE_EXTRA_CA_CERTS=/data/homelab.crt
      - ACTUAL_OPENID_AUTH_METHOD=openid
      - ACTUAL_OPENID_ENABLED=true
      - ACTUAL_OPENID_DISCOVERY_URL=https://auth.${DOMAIN_PORT}/.well-known/openid-configuration
      - ACTUAL_OPENID_SERVER_HOSTNAME=https://actualbudget.${DOMAIN_PORT}
      - ACTUAL_OPENID_CLIENT_ID=actual-budget
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - ./actual_data:/data
      - ${CERT_CRT}:/data/homelab.crt:ro
      - /etc/localtime:/etc/localtime:ro
    secrets:
      - actual_secret
    entrypoint: >
      /bin/sh -c "export ACTUAL_OPENID_CLIENT_SECRET=$$(cat /run/secrets/actual_secret) && exec node app.js"
    restart: unless-stopped
    networks:
      - homelab-internal
    healthcheck:
      test: ["CMD-SHELL", "node src/scripts/health-check.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

secrets:
  wakapi_password:
    file: .pswd/pswdwaka
  vikunja_password:
    file: .pswd/pswdvikunja
  vikunja_secret:
    file: .pswd/secretvin
  vaultwarden_db_password:
    file: .pswd/pswdvault
  actual_secret:
    file: .pswd/actualSecret

networks:
  homelab-internal:
    external: true
  homelab-private:
    external: true
